<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostLane DeFlock Importer</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { background-color: #05070d; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    h2 { color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
    p { color: #94a3b8; text-align: center; font-size: 0.9rem; margin-bottom: 30px; max-width: 400px; }
    .btn-import { background: #ef4444; color: #ffffff; border: none; padding: 16px 32px; border-radius: 12px; font-size: 1.1rem; font-weight: 900; text-transform: uppercase; cursor: pointer; box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
    .btn-import:active { transform: scale(0.95); }
    #console-log { margin-top: 30px; width: 100%; max-width: 500px; background: #0b1120; border: 1px solid #1e293b; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 0.8rem; color: #4ade80; white-space: pre-wrap; min-height: 200px; max-height: 400px; overflow-y: auto; }
  </style>
</head>
<body>

  <h2>Cloud Mesh Importer</h2>
  <p>This utility will fetch real-world DeFlock ALPR data for Oklahoma and push it securely into your Supabase database.</p>
  
  <button class="btn-import" onclick="startImport()" id="import-btn">Start Data Extraction</button>

  <div id="console-log">System Ready... Waiting to initiate extraction.</div>

  <script>
    const SUPABASE_URL = "https://zksyyjpepnulbmkscpyl.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inprc3l5anBlcG51bGJta3NjcHlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODgyNDIsImV4cCI6MjEwMjY2NDI0Mn0.AwuWWmIRfSObc8IFDxClSBV_yC3VY0k1Q_2rAB-B27k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const logConsole = document.getElementById('console-log');
    const importBtn = document.getElementById('import-btn');

    function printLog(message) {
      logConsole.innerText += `\n[>>] ${message}`;
      logConsole.scrollTop = logConsole.scrollHeight;
    }

    async function startImport() {
      importBtn.disabled = true;
      importBtn.style.opacity = "0.5";
      printLog("Connecting to OpenStreetMap/DeFlock API...");

      // Bounding Box for Oklahoma: (Min Lat, Min Lng, Max Lat, Max Lng)
      const query = `[out:json][timeout:30];node["man_made"="surveillance"]["surveillance:type"~"ALPR|automatic_number_plate_recognition"](33.5,-100.0,37.0,-94.0);out body;`;
      const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

      try {
        const response = await fetch(url);
        const data = await response.json();
        const nodes = data.elements || [];
        
        printLog(`SUCCESS: Located ${nodes.length} real ALPR cameras in the target sector.`);

        if (nodes.length === 0) {
          printLog("No cameras found. Terminating protocol.");
          importBtn.disabled = false;
          importBtn.style.opacity = "1";
          return;
        }

        printLog("Formatting target data for GhostLane Cloud Mesh...");
        
        const insertData = nodes.map(n => ({
          lat: n.lat,
          lng: n.lon,
          node_id: `DEFLOCK-${n.id}`,
          heading: (n.tags && n.tags["camera:direction"]) ? parseInt(n.tags["camera:direction"]) : 0,
          label: (n.tags && n.tags.operator) ? n.tags.operator : 'DeFlock ALPR'
        }));

        printLog("Initiating bulk push to Supabase in batches of 50...");

        let successCount = 0;
        for (let i = 0; i < insertData.length; i += 50) {
          const batch = insertData.slice(i, i + 50);
          
          const { error } = await _supabase.from('cameras').insert(batch);
          
          if (error) {
            printLog(`ERROR on batch: ${error.message}`);
          } else {
            successCount += batch.length;
            printLog(`Pushing... ${successCount} nodes secured in Cloud Mesh.`);
          }
        }

        printLog("EXTRACTION COMPLETE! Your GhostLane app is now loaded with real data.");
        printLog("You can safely close this page and open your GhostLane app.");

      } catch (err) {
        printLog(`CRITICAL ERROR: ${err.message}`);
        importBtn.disabled = false;
        importBtn.style.opacity = "1";
      }
    }
  </script>
</body>
</html>
