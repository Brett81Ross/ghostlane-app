  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playPing(freq=920,type='sine',duration=.1){if(audioCtx.state==='suspended')audioCtx.resume();try{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audioCtx.currentTime);gain.gain.setValueAtTime(.18,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration);}catch(e){console.warn(e)}}
    const synth=window.speechSynthesis;
    function speakAlert(text){if(synth.speaking)synth.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.rate=.95;utterance.pitch=1;synth.speak(utterance)}

    const SUPABASE_URL="https://zksyyjpepnulbmkscpyl.supabase.co";
    const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inprc3l5anBlcG51bGJta3NjcHlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODgyNDIsImV4cCI6MjEwMjY2NDI0Mn0.AwuWWmIRfSObc8IFDxClSBV_yC3VY0k1Q_2rAB-B27k";
    const _supabase=(typeof supabase!=='undefined')?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;

    let userCoords=[35.4676,-97.5164],isRadarActive=false,logNodeMode=false,userMarker=null,routePolyline=null,routeSteps=[],currentStepIdx=0,radarWatchId=null,hasLiveGpsFix=false,lastThreatAlertAt=0,lastThreatKey=null,toastTimer=null,activeModalResolver=null;

    function showHudModal(title,message,options={}){
      const modal=document.getElementById('hud-modal'),card=document.getElementById('hud-modal-card'),titleEl=document.getElementById('hud-modal-title'),messageEl=document.getElementById('hud-modal-message'),cancelBtn=document.getElementById('hud-modal-cancel'),confirmBtn=document.getElementById('hud-modal-confirm');
      if(activeModalResolver)activeModalResolver(false);
      titleEl.textContent=title||'GhostLane'; messageEl.textContent=message||''; card.className=`hud-modal-card ${options.tone||''}`.trim(); confirmBtn.className=`hud-modal-confirm ${options.tone==='danger'?'danger':''}`.trim(); confirmBtn.textContent=options.confirmLabel||'OK'; cancelBtn.textContent=options.cancelLabel||'Cancel'; cancelBtn.style.display=options.confirm?'inline-flex':'none'; modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
      return new Promise(resolve=>{activeModalResolver=resolve;const finish=value=>{modal.classList.remove('show');modal.setAttribute('aria-hidden','true');activeModalResolver=null;resolve(value)};confirmBtn.onclick=()=>finish(true);cancelBtn.onclick=()=>finish(false)});

    function showHudToast(message,tone=''){const toast=document.getElementById('hud-toast');if(toastTimer)clearTimeout(toastTimer);toast.textContent=message;toast.className=`hud-toast ${tone}`.trim();requestAnimationFrame(()=>toast.classList.add('show'));toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
    function cameraKey(cam){return String(cam.node_id||cam.id||`${cam.lat.toFixed(6)},${cam.lng.toFixed(6)}`)}
    function buildNodePopup(cam){const id=cam.node_id||cam.id||'UNKNOWN NODE',label=cam.label||cam.hardware||'Optical Trap',heading=Number.isFinite(Number(cam.heading))?`${Math.round(Number(cam.heading))}°`:'Unknown',source=cam._cloud?'Cloud Mesh':(cam._manual?'User Logged':'Local Mesh');return `<div class="node-popup-title">${id}</div><div class="node-popup-type">${label}</div><div class="node-popup-meta"><span>Lens heading: ${heading}</span><span>Source: ${source}</span></div><div class="node-popup-hint">Press and hold node to delete</div>`}

    const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([35.4676,-97.5164],11);

    let cameraLocations=[];
    const basePoints=[{lat:35.4676,lng:-97.5164,count:48,spread:.055},{lat:35.5053,lng:-97.6406,count:26,spread:.035},{lat:35.4495,lng:-97.3967,count:28,spread:.038},{lat:35.3395,lng:-97.4867,count:32,spread:.032}];
    const headings=[{h:0,l:'Northbound'},{h:45,l:'Northeast'},{h:90,l:'Eastbound'},{h:135,l:'Southeast'},{h:180,l:'Southbound'},{h:225,l:'Southwest'},{h:270,l:'Westbound'},{h:315,l:'Northwest'}];
    let seed=42;function deterministicRandom(){seed=(seed*9301+49297)%233280;return seed/233280}
    basePoints.forEach((bp,bIdx)=>{for(let i=0;i<bp.count;i++){const offsetLat=(deterministicRandom()-.5)*bp.spread*2,offsetLng=(deterministicRandom()-.5)*bp.spread*2,dir=headings[Math.floor(deterministicRandom()*headings.length)];cameraLocations.push({lat:bp.lat+offsetLat,lng:bp.lng+offsetLng,id:`ALPR-${1000+bIdx*50+i}`,heading:dir.h,label:dir.l})}});

    let hiddenNodeKeys=[];try{hiddenNodeKeys=JSON.parse(localStorage.getItem('gl_hidden_nodes')||'[]');const savedNodes=JSON.parse(localStorage.getItem('gl_manual_nodes')||'[]');savedNodes.forEach(n=>cameraLocations.push({...n,_manual:true}));cameraLocations=cameraLocations.filter(cam=>!hiddenNodeKeys.includes(cameraKey(cam)))}catch(e){console.warn('Local storage check bypassed')}
    const cameraLayerGroup=L.layerGroup().addTo(map);

    function removeLocalNodeReferences(cam){const key=cameraKey(cam);cameraLocations=cameraLocations.filter(c=>cameraKey(c)!==key);try{const saved=JSON.parse(localStorage.getItem('gl_manual_nodes')||'[]'),filtered=saved.filter(n=>cameraKey(n)!==key);localStorage.setItem('gl_manual_nodes',JSON.stringify(filtered));if(!cam._manual&&!cam._cloud){const hidden=JSON.parse(localStorage.getItem('gl_hidden_nodes')||'[]');if(!hidden.includes(key))hidden.push(key);localStorage.setItem('gl_hidden_nodes',JSON.stringify(hidden))}}catch(err){console.warn('Local node cleanup skipped:',err)}}

    async function deleteCameraNode(cam){const nodeId=cam.node_id||cam.id||'this node',confirmed=await showHudModal('Delete Surveillance Node',`Remove ${nodeId} from GhostLane?${cam._cloud?' This will also delete it from the cloud mesh.':''}`,{confirm:true,confirmLabel:'Delete Node',tone:'danger'});if(!confirmed)return;if(cam._cloud&&_supabase){try{const cloudId=cam.node_id||cam.id;let deleteQuery=_supabase.from('cameras').delete();deleteQuery=cam.node_id?deleteQuery.eq('node_id',cloudId):deleteQuery.eq('id',cloudId);const{error}=await deleteQuery;if(error)throw error}catch(err){console.error('Cloud delete failed:',err);await showHudModal('Cloud Delete Failed','GhostLane could not remove this node from Supabase, so it was left on the map.',{tone:'danger'});return}}removeLocalNodeReferences(cam);renderCameras();playPing(520,'square',.1);showHudToast(`${nodeId} removed from mesh.`,'danger')}

    function attachLongPressDelete(marker,cam){const el=marker.getElement();if(!el)return;let timer=null,startX=0,startY=0,fired=false;const clear=()=>{if(timer)clearTimeout(timer);timer=null};el.addEventListener('pointerdown',e=>{fired=false;startX=e.clientX;startY=e.clientY;clear();timer=setTimeout(()=>{fired=true;marker._ghostLongPressed=true;map.closePopup();if(navigator.vibrate)navigator.vibrate(35);deleteCameraNode(cam)},700)},{passive:true});el.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-startX)>9||Math.abs(e.clientY-startY)>9)clear()},{passive:true});el.addEventListener('pointerup',clear,{passive:true});el.addEventListener('pointercancel',clear,{passive:true});el.addEventListener('pointerleave',clear,{passive:true});marker.on('contextmenu',e=>{L.DomEvent.preventDefault(e.originalEvent);deleteCameraNode(cam)});marker.on('popupopen',()=>{if(marker._ghostLongPressed||fired){map.closePopup(marker.getPopup());marker._ghostLongPressed=false;fired=false}})}

    function renderCameras(){cameraLayerGroup.clearLayers();cameraLocations.forEach(cam=>{const icon=L.divIcon({className:'custom-cone-icon',html:getConeHtml(cam.heading||0),iconSize:[60,60],iconAnchor:[30,30],popupAnchor:[0,-15]});const marker=L.marker([cam.lat,cam.lng],{icon}).bindPopup(buildNodePopup(cam),{closeButton:true,maxWidth:250}).addTo(cameraLayerGroup);attachLongPressDelete(marker,cam)});document.getElementById('stat-cameras').innerText=cameraLocations.length}
    renderCameras();

    async function syncCloudCameras(){if(!_supabase)return;try{const{data,error}=await _supabase.from('cameras').select('*');if(!error&&data&&data.length>0){let updated=false;data.forEach(dbCam=>{const cloudCam={...dbCam,_cloud:true};if(hiddenNodeKeys.includes(cameraKey(cloudCam)))return;const existingIndex=cameraLocations.findIndex(c=>cameraKey(c)===cameraKey(cloudCam)||(c.lat===dbCam.lat&&c.lng===dbCam.lng));if(existingIndex===-1){cameraLocations.push(cloudCam);updated=true}else if(!cameraLocations[existingIndex]._cloud){cameraLocations[existingIndex]={...cameraLocations[existingIndex],...cloudCam};updated=true}});if(updated)renderCameras()}}catch(err){console.warn('Background sync ignored:',err)}}
    syncCloudCameras();

    function openSearch(){document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-shadow').classList.add('active');document.getElementById('search-modal').style.display='flex';playPing(1000,'sine',.1)}
    function closeSearch(){document.getElementById('search-modal').style.display='none'}

    async function executeSearch(){const query=document.getElementById('dest-address').value;if(!query)return;closeSearch();speakAlert('Calculating zero trace evasion vectors.');const nomUrl=`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;try{const res=await fetch(nomUrl),data=await res.json();if(data.length>0){const destCoords=[parseFloat(data[0].lat),parseFloat(data[0].lon)],start=`${userCoords[1]},${userCoords[0]}`,end=`${destCoords[1]},${destCoords[0]}`,osrmUrl=`https://router.project-osrm.org/route/v1/driving/${start};${end}?overview=full&geometries=geojson&steps=true`;const oRes=await fetch(osrmUrl),oData=await oRes.json();if(oData.routes&&oData.routes.length>0){if(routePolyline)map.removeLayer(routePolyline);const coords=oData.routes[0].geometry.coordinates.map(pt=>[pt[1],pt[0]]);routePolyline=L.polyline(coords,{color:'#38bdf8',weight:6,dashArray:'8, 8'}).addTo(map);map.fitBounds(routePolyline.getBounds(),{padding:[60,60]});routeSteps=oData.routes[0].legs[0].steps;currentStepIdx=0;document.getElementById('turn-hud').style.display='flex';updateTurnHUD(routeSteps[currentStepIdx]);const firstInstruction=routeSteps[currentStepIdx].maneuver.instruction||`Drive on ${routeSteps[currentStepIdx].name||'Shadow Vector'}`;speakAlert('Shadow route acquired. '+firstInstruction)}}else speakAlert('Target destination not found.')}catch(err){console.error(err);speakAlert('Routing network error.')}}

    function updateTurnHUD(step){const modifier=(step.maneuver&&step.maneuver.modifier)?step.maneuver.modifier:'';let icon='⬆';if(modifier.includes('right'))icon='↱';if(modifier.includes('left'))icon='↰';if(modifier.includes('uturn'))icon='↻';let text=step.maneuver.instruction;if(!text||text==='undefined')text=step.name?`Proceed onto ${step.name}`:'Proceed along Shadow Vector';document.getElementById('turn-icon').innerText=icon;document.getElementById('turn-instruction').innerText=text;const distStr=step.distance>1609.34?(step.distance*.000621371).toFixed(1)+' mi':Math.round(step.distance*3.28084)+' ft';document.getElementById('turn-distance').innerText='In '+distStr}

    function updateFromPosition(pos){userCoords=[pos.coords.latitude,pos.coords.longitude];hasLiveGpsFix=true;userMarker.setLatLng(userCoords);const speed=pos.coords.speed&&pos.coords.speed>0?Math.round(pos.coords.speed*2.23694):0;document.getElementById('stat-speed').innerHTML=`${speed} <span style="font-size:0.65rem;">MPH</span>`;if(pos.coords.heading!==null&&!isNaN(pos.coords.heading)){const h=Math.round(pos.coords.heading);document.getElementById('stat-heading').innerHTML=`${h}° <span style="font-size:0.65rem;">HDG</span>`;const arrow=document.getElementById('user-arrow');if(arrow)arrow.style.transform=`rotate(${h}deg)`}if(isRadarActive)evaluateRadarThreats();updateRouteProgress()}

    function updateRouteProgress(){if(!(routeSteps.length>0&&currentStepIdx<routeSteps.length))return;const nextManeuver=routeSteps[currentStepIdx].maneuver.location,distToTurn=map.distance(userCoords,[nextManeuver[1],nextManeuver[0]]),distStr=distToTurn>1609.34?(distToTurn*.000621371).toFixed(1)+' mi':Math.round(distToTurn*3.28084)+' ft';document.getElementById('turn-distance').innerText='In '+distStr;if(distToTurn<40){currentStepIdx++;if(currentStepIdx<routeSteps.length){updateTurnHUD(routeSteps[currentStepIdx]);const stepText=routeSteps[currentStepIdx].maneuver.instruction||`Turn onto ${routeSteps[currentStepIdx].name||'route'}`;speakAlert(stepText)}else{speakAlert('Target destination reached. Zero trace confirmed.');document.getElementById('turn-hud').style.display='none';routeSteps=[]}}}

    function evaluateRadarThreats(){let closest=null,closestMeters=Infinity;for(const cam of cameraLocations){const distance=map.distance(userCoords,[cam.lat,cam.lng]);if(distance<closestMeters){closest=cam;closestMeters=distance}}if(!closest||closestMeters>=180)return;const now=Date.now(),key=cameraKey(closest),canAlert=key!==lastThreatKey||now-lastThreatAlertAt>10000;if(!canAlert)return;lastThreatKey=key;lastThreatAlertAt=now;playPing(440,'sawtooth',.15);const feet=Math.max(1,Math.round(closestMeters*3.28084));speakAlert(`Optical surveillance node ahead. ${feet} feet.`);showHudToast(`RADAR: surveillance node ${feet} ft away`,'danger')}

    function startRadarWatch(){if(!('geolocation'in navigator)){showHudModal('GPS Required','This device does not expose geolocation to GhostLane.',{tone:'danger'});return false}if(radarWatchId!==null)return true;radarWatchId=navigator.geolocation.watchPosition(updateFromPosition,err=>{stopRadarWatch();isRadarActive=false;updateRadarButton();showHudModal('GPS Signal Unavailable',err.message||'GhostLane could not obtain a live GPS fix.',{tone:'danger'})},{enableHighAccuracy:true,maximumAge:1000,timeout:12000});return true}
    function stopRadarWatch(){if(radarWatchId!==null&&'geolocation'in navigator)navigator.geolocation.clearWatch(radarWatchId);radarWatchId=null}
    function updateRadarButton(){const btn=document.getElementById('radar-toggle-btn'),text=document.getElementById('radar-btn-text');if(isRadarActive){btn.classList.add('active');text.innerText='RADAR ACTIVE'}else{btn.classList.remove('active');text.innerText='START RADAR'}}
    function toggleRadarMode(){if(isRadarActive){isRadarActive=false;stopRadarWatch();updateRadarButton();showHudToast('Radar monitoring paused.');return}if(!startRadarWatch())return;isRadarActive=true;updateRadarButton();playPing(880,'sine',.2);showHudToast('Live radar monitoring active.')}

    function requestCurrentPosition({center=false,silent=false}={}){if(!('geolocation'in navigator)){if(!silent)showHudModal('GPS Required','This device does not expose geolocation to GhostLane.',{tone:'danger'});return}navigator.geolocation.getCurrentPosition(pos=>{updateFromPosition(pos);if(center){map.setView(userCoords,16,{animate:true});playPing(1100,'sine',.1)}},err=>{if(!silent)showHudModal('Current Location Unavailable',err.message||'GhostLane could not obtain your current location.',{tone:'danger'})},{enableHighAccuracy:true,maximumAge:1500,timeout:10000})}
    function centerCurrentLocation(){requestCurrentPosition({center:true})}
    function focusNearestNode(){if(!hasLiveGpsFix){showHudToast('Getting GPS fix before targeting nearest node…');requestCurrentPosition({center:false});return}if(!cameraLocations.length)return;let nearest=cameraLocations[0],min=Infinity;cameraLocations.forEach(cam=>{const d=map.distance(userCoords,[cam.lat,cam.lng]);if(d<min){min=d;nearest=cam}});map.setView([nearest.lat,nearest.lng],16,{animate:true});showHudToast(`Targeting nearest node • ${Math.round(min*3.28084)} ft`);playPing(1040,'sine',.1)}
    requestCurrentPosition({center:false,silent:true});

    function switchTab(tabId){document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));document.getElementById(`tab-${tabId}`).classList.add('active');logNodeMode=(tabId==='log');if(tabId==='radar'){closeSearch();map.closePopup();map.invalidateSize();showHudToast(isRadarActive?'Radar view active • live monitoring is ON':'Radar view ready • tap START RADAR for live monitoring')}else if(tabId==='ledger'){showHudModal('Surveillance Ledger',`${cameraLocations.length} optical traps currently cataloged. Open Admin / Mesh Tools to scan live public camera nodes, correct roadway placement, or add a node from your current GPS location.`,{confirm:true,confirmLabel:'Admin / Mesh Tools',cancelLabel:'Close'}).then(openAdmin=>{if(openAdmin)window.location.href='/admin.html'})}else if(tabId==='log')showHudToast('LOG NODE MODE • Tap anywhere on the map to place a node.','orange')}

    map.on('click',async function(e){if(logNodeMode){const newNode={lat:e.latlng.lat,lng:e.latlng.lng,id:`MANUAL-${Math.floor(1000+Math.random()*9000)}`,heading:0,label:'User Logged Trap'};newNode._manual=true;cameraLocations.push(newNode);try{const stored=JSON.parse(localStorage.getItem('gl_manual_nodes')||'[]');stored.push(newNode);localStorage.setItem('gl_manual_nodes',JSON.stringify(stored))}catch(err){}renderCameras();playPing(800,'square',.12);showHudToast('Optical node logged to mesh.','orange');if(_supabase){try{const{error}=await _supabase.from('cameras').insert([{lat:newNode.lat,lng:newNode.lng,node_id:newNode.id,heading:newNode.heading,label:newNode.label}]);if(error)throw error;newNode._cloud=true}catch(err){console.warn('Cloud push failed:',err);showHudToast('Node saved locally • cloud sync failed.','danger')}}}});
  </script>
</body>
