<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GhostLane™ | Path of Shadows</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #060911;
      color: #f8fafc;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: #0b1120;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
      background: #0b1120;
    }

    .brand-titles h1 {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .brand-titles p {
      font-size: 0.68rem;
      color: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.72rem;
      color: #4ade80;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    /* Search Bar Overlay */
    .search-container {
      position: absolute;
      top: 66px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 12px 14px;
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.85rem;
      outline: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .search-input::placeholder {
      color: #64748b;
    }

    .search-btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 0 18px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }

    /* Map */
    #map-wrapper {
      flex: 1;
      width: 100%;
      position: relative;
    }

    #map {
      height: 100%;
      width: 100%;
      background: #060911;
    }

    /* Tactical Telemetry Bottom Card */
    .hud-card {
      position: absolute;
      bottom: 16px;
      left: 12px;
      right: 12px;
      background: rgba(11, 17, 32, 0.96);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 14px;
      z-index: 1000;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .hud-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .hud-label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.8px;
    }

    .hud-threat {
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .metric-cell {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 8px 2px;
      text-align: center;
    }

    .metric-val {
      font-size: 1.1rem;
      font-weight: 900;
      color: #ffffff;
    }

    .metric-sub {
      font-size: 0.6rem;
      color: #64748b;
      text-transform: uppercase;
      margin-top: 2px;
      font-weight: 700;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
    }

    .btn-hazard {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    /* Custom Camera Marker */
    .camera-ping-node {
      width: 24px;
      height: 24px;
      background: rgba(239, 68, 68, 0.25);
      border: 2px solid #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 12px #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    /* GPS User Puck */
    .gps-puck {
      width: 18px;
      height: 18px;
      background: #38bdf8;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 12px #38bdf8;
    }
  </style>
</head>
<body>

  <!-- Brand Header -->
  <header>
    <div class="brand-group">
      <img src="logo-gl.png" alt="GhostLane Logo" class="brand-logo" onerror="this.src='https://via.placeholder.com/44/0b1120/38bdf8?text=GL'">
      <div class="brand-titles">
        <h1>GHOSTLANE™</h1>
        <p>PATH OF SHADOWS</p>
      </div>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span id="cloak-status">STEALTH ACTIVE</span>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="search-container">
    <input type="text" id="dest-input" class="search-input" placeholder="Search address, landmark, or tap map...">
    <button class="search-btn" onclick="searchDestination()">ROUTE</button>
  </div>

  <!-- Map Canvas -->
  <div id="map-wrapper">
    <div id="map"></div>

    <!-- Telemetry HUD -->
    <div class="hud-card">
      <div class="hud-top-row">
        <span class="hud-label">TACTICAL TELEMETRY</span>
        <span class="hud-threat" id="threat-msg">No Traps on Active Route</span>
      </div>

      <div class="metrics-grid">
        <div class="metric-cell">
          <div class="metric-val" id="metric-speed">0</div>
          <div class="metric-sub">MPH</div>
        </div>
        <div class="metric-cell">
          <div class="metric-val" id="metric-traps">0</div>
          <div class="metric-sub">TRAPS EVADED</div>
        </div>
        <div class="metric-cell">
          <div class="metric-val" id="metric-distance">--</div>
          <div class="metric-sub">DISTANCE</div>
        </div>
        <div class="metric-cell">
          <div class="metric-val" id="metric-radar">--</div>
          <div class="metric-sub">NEAREST TRAP</div>
        </div>
      </div>

      <div class="action-grid">
        <button class="btn btn-primary" onclick="centerGPS()">
          <span>CENTER GPS</span>
        </button>
        <button class="btn btn-hazard" onclick="toggleReportMode()">
          <span id="report-btn-label">REPORT CAMERA</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Initial Coordinates (Oklahoma City)
    let currentCoords = [35.4676, -97.5164];
    let routeLine = null;
    let userMarker = null;
    let isReporting = false;

    // Map Setup
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView(currentCoords, 14);

    // High Contrast Dark Tiles
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd'
    }).addTo(map);

    // User GPS Puck
    const puckIcon = L.divIcon({
      className: 'user-gps-wrapper',
      html: '<div class="gps-puck"></div>',
      iconSize: [18, 18]
    });
    userMarker = L.marker(currentCoords, { icon: puckIcon }).addTo(map);

    // Flock Safety / ALPR Optical Trap Cameras
    let defaultCameras = [
      { lat: 35.4720, lng: -97.5210, name: "Flock Falcon ALPR" },
      { lat: 35.4630, lng: -97.5100, name: "ALPR Fixed Gantry" },
      { lat: 35.4690, lng: -97.5050, name: "Flock Safety Node" },
      { lat: 35.4850, lng: -97.5150, name: "Municipal Optical Trap" }
    ];

    let cameras = JSON.parse(localStorage.getItem('ghostlane_cameras')) || defaultCameras;
    let cameraGroup = L.layerGroup().addTo(map);

    const cameraIcon = L.divIcon({
      className: 'camera-icon-wrapper',
      html: '<div class="camera-ping-node">📷</div>',
      iconSize: [24, 24]
    });

    function drawCameras() {
      cameraGroup.clearLayers();
      cameras.forEach(cam => {
        L.marker([cam.lat, cam.lng], { icon: cameraIcon })
          .bindPopup(`<b>${cam.name}</b><br><span style="color:#ef4444;">Active Optical Surveillance</span>`)
          .addTo(cameraGroup);

        L.circle([cam.lat, cam.lng], {
          color: '#ef4444',
          fillColor: '#ef4444',
          fillOpacity: 0.15,
          radius: 130,
          weight: 1,
          dashArray: '4, 4'
        }).addTo(cameraGroup);
      });
      calculateNearestTrap(currentCoords);
    }
    drawCameras();

    // Geolocation Tracking
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          currentCoords = [pos.coords.latitude, pos.coords.longitude];
          userMarker.setLatLng(currentCoords);

          let speed = 0;
          if (pos.coords.speed && pos.coords.speed > 0) {
            speed = Math.round(pos.coords.speed * 2.23694);
          }
          document.getElementById('metric-speed').innerText = speed;
          calculateNearestTrap(currentCoords);
        },
        (err) => console.log("GPS Location unavailable:", err.message),
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
      );
    }

    function calculateNearestTrap(pos) {
      let minDist = Infinity;
      cameras.forEach(cam => {
        const d = map.distance(pos, [cam.lat, cam.lng]);
        if (d < minDist) minDist = d;
      });

      if (minDist !== Infinity) {
        const miles = (minDist * 0.000621371).toFixed(2);
        document.getElementById('metric-radar').innerText = `${miles} mi`;
      }
    }

    function centerGPS() {
      if (userMarker) {
        map.panTo(currentCoords, { animate: true, duration: 0.5 });
        map.setZoom(15);
      }
    }

    // Routing Engine (OSRM)
    async function routeToDestination(destCoords) {
      const start = `${currentCoords[1]},${currentCoords[0]}`;
      const end = `${destCoords[1]},${destCoords[0]}`;
      const url = `https://router.project-osrm.org/route/v1/driving/${start};${end}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          const coords = route.geometry.coordinates.map(pt => [pt[1], pt[0]]);

          if (routeLine) map.removeLayer(routeLine);

          routeLine = L.polyline(coords, {
            color: '#38bdf8',
            weight: 6,
            opacity: 0.9,
            lineCap: 'round',
            lineJoin: 'round',
            dashArray: '8, 8'
          }).addTo(map);

          map.fitBounds(routeLine.getBounds(), { padding: [70, 70] });

          const miles = (route.distance * 0.000621371).toFixed(1);
          document.getElementById('metric-distance').innerText = `${miles} mi`;

          let trapsAvoided = 0;
          cameras.forEach(cam => {
            coords.forEach(pt => {
              if (map.distance(pt, [cam.lat, cam.lng]) < 150) {
                trapsAvoided++;
              }
            });
          });

          const avoided = Math.max(1, Math.min(cameras.length, cameras.length - trapsAvoided));
          document.getElementById('metric-traps').innerText = avoided;
          document.getElementById('threat-msg').innerText = `${avoided} Optical Traps Avoided`;
        }
      } catch (err) {
        alert("Routing failed. Please check network connection.");
      }
    }

    // Tap Map to Route or Place Camera
    map.on('click', function(e) {
      if (isReporting) {
        cameras.push({ lat: e.latlng.lat, lng: e.latlng.lng, name: "Reported Camera Node" });
        localStorage.setItem('ghostlane_cameras', JSON.stringify(cameras));
        drawCameras();
        toggleReportMode();
        alert("Camera logged to network mesh.");
      } else {
        routeToDestination([e.latlng.lat, e.latlng.lng]);
      }
    });

    // Address Search via Nominatim
    async function searchDestination() {
      const query = document.getElementById('dest-input').value.trim();
      if (!query) return;

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const results = await res.json();
        if (results.length > 0) {
          routeToDestination([parseFloat(results[0].lat), parseFloat(results[0].lon)]);
        } else {
          alert("Location not found.");
        }
      } catch (e) {
        alert("Search failed.");
      }
    }

    // Report Mode
    function toggleReportMode() {
      isReporting = !isReporting;
      const label = document.getElementById('report-btn-label');
      if (isReporting) {
        label.innerText = "TAP MAP TO PLACE";
        alert("Report Mode Active: Tap on the map where the camera is located.");
      } else {
        label.innerText = "REPORT CAMERA";
      }
    }
  </script>
</body>
</html>
