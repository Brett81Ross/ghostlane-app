<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GhostLane™ | Path of Shadows</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    header {
      background: rgba(11, 15, 25, 0.95);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .brand-text h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .brand-text p {
      font-size: 0.7rem;
      color: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.4);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: #4ade80;
      font-weight: 600;
    }

    .status-pulse {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* Map Interface */
    #map-container {
      flex: 1;
      width: 100%;
      position: relative;
      background-color: #050811;
    }

    #map {
      height: 100%;
      width: 100%;
      background: #050811;
    }

    /* Floating Tactical Overlay */
    .hud-card {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 16px;
      z-index: 1000;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .hud-title {
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .threat-level {
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }

    .stat-val {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
    }

    .stat-lbl {
      font-size: 0.65rem;
      color: #64748b;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, #1d4ed8, #0284c7);
      border: none;
      color: #ffffff;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    /* Leaflet Custom Marker Styling */
    .custom-radar-marker {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radar-ping {
      width: 16px;
      height: 16px;
      background-color: #ef4444;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 10px #ef4444;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-container">
      <img src="logo-gl.png" alt="GhostLane Logo" class="brand-logo" onerror="this.src='https://via.placeholder.com/44/0f172a/38bdf8?text=GL'">
      <div class="brand-text">
        <h1>GhostLane</h1>
        <p>Path of Shadows</p>
      </div>
    </div>
    <div class="status-badge">
      <div class="status-pulse"></div>
      <span>STEALTH ACTIVE</span>
    </div>
  </header>

  <div id="map-container">
    <div id="map"></div>

    <div class="hud-card">
      <div class="hud-header">
        <span class="hud-title">Vector Telemetry</span>
        <span class="threat-level">0 Optical Traps on Route</span>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-val" id="evasion-rate">100%</div>
          <div class="stat-lbl">Cloak Index</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="traps-bypassed">14</div>
          <div class="stat-lbl">ALPR Bypassed</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">34 ms</div>
          <div class="stat-lbl">Route Ping</div>
        </div>
      </div>

      <button class="action-btn" onclick="recalculateStealthRoute()">
        <span>REROUTE TO GHOST PATH</span>
      </button>
    </div>
  </div>

  <script>
    // Initialize map with dark tiles
    const initialCoords = [35.4676, -97.5164]; // Default Center
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView(initialCoords, 14);

    // High-contrast Dark Navigation Tiles
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd'
    }).addTo(map);

    // Mock ALPR / Surveillance Camera Markers
    const cameraLocations = [
      { coords: [35.4720, -97.5210], label: "Flock ALPR Array #104" },
      { coords: [35.4630, -97.5100], label: "Surveillance Gantry #082" },
      { coords: [35.4690, -97.5050], label: "Traffic Monitor Node #331" }
    ];

    const radarIcon = L.divIcon({
      className: 'custom-radar-marker',
      html: '<div class="radar-ping"></div>',
      iconSize: [16, 16]
    });

    cameraLocations.forEach(cam => {
      L.marker(cam.coords, { icon: radarIcon })
        .addTo(map)
        .bindPopup(`<b>${cam.label}</b><br><span style="color:#ef4444;">Optical Trap Active</span>`);
    });

    // Mock Active Stealth Path
    const stealthRouteCoordinates = [
      [35.4590, -97.5250],
      [35.4620, -97.5200],
      [35.4660, -97.5180],
      [35.4710, -97.5140],
      [35.4750, -97.5110]
    ];

    const routeLine = L.polyline(stealthRouteCoordinates, {
      color: '#38bdf8',
      weight: 5,
      opacity: 0.85,
      dashArray: '8, 8',
      lineCap: 'round'
    }).addTo(map);

    function recalculateStealthRoute() {
      const bypassedCount = document.getElementById('traps-bypassed');
      let current = parseInt(bypassedCount.innerText);
      bypassedCount.innerText = current + 1;
      alert("GhostLane: Route optimized. Optical evasion vectors applied.");
    }
  </script>
</body>
</html>
