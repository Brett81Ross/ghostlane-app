<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>GhostLane™ Radar</title><meta name="theme-color" content="#080d1a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="GhostLane"><link rel="manifest" href="/manifest.json"><link rel="icon" type="image/png" href="/logo-gl.png"><link rel="apple-touch-icon" href="/logo-gl.png"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06080e}iframe{border:0;width:100%;height:100%;display:block;background:#06080e}</style></head><body><iframe id="radar" src="/index.html" allow="geolocation"></iframe><script>let installPrompt=null;let installButton=null;const ua=navigator.userAgent||'';const isIOS=/iPad|iPhone|iPod/.test(ua)||(/Macintosh/.test(ua)&&'ontouchend'in document);function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}function updateInstallButton(){if(!installButton)return;if(isStandalone()){installButton.remove();installButton=null;return}installButton.style.display='flex';installButton.textContent=isIOS?'＋ ADD TO HOME':'⬇ INSTALL'}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;updateInstallButton()});window.addEventListener('appinstalled',()=>{installPrompt=null;if(installButton){installButton.remove();installButton=null}});async function handleInstall(){if(isStandalone())return;try{const d=document.getElementById('radar').contentDocument,w=d?.defaultView;if(isIOS){if(w&&typeof w.showHudModal==='function'){w.showHudModal('Add GhostLane to iPhone','In Safari, tap the Share button, then choose “Add to Home Screen.” GhostLane will use the GhostLane logo as its home-screen icon and open like a standalone app.',{})}else alert('In Safari, tap Share, then Add to Home Screen.');return}if(installPrompt){await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;updateInstallButton();return}if(w&&typeof w.showHudModal==='function'){w.showHudModal('Install GhostLane','On Android Chrome, tap the browser menu (⋮) and choose “Install app” or “Add to Home screen.” GhostLane will use the GhostLane logo as its app icon.',{})}else alert('Tap your browser menu and choose Install app or Add to Home screen.')}catch(e){console.warn(e)}}const f=document.getElementById('radar');f.addEventListener('load',()=>{try{const d=f.contentDocument;const footer=d.querySelector('.app-footer');if(footer)footer.textContent='GhostLane™ • v1.3.3 • Cactus🌵Byte Studios™ • All Rights Reserved';const header=d.querySelector('header');if(header&&!isStandalone()&&!d.getElementById('gl-install-btn')){installButton=d.createElement('button');installButton.id='gl-install-btn';installButton.type='button';installButton.textContent=isIOS?'＋ ADD TO HOME':'⬇ INSTALL';installButton.style.cssText='display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid rgba(74,222,128,.58);background:rgba(6,78,59,.82);color:#86efac;border-radius:999px;padding:9px 11px;font-size:.60rem;font-weight:900;letter-spacing:.55px;cursor:pointer;white-space:nowrap;';installButton.onclick=handleInstall;header.appendChild(installButton)}const clean=d.createElement('script');clean.src='/production-nodes.js?v=1.3.3';d.body.appendChild(clean);clean.onload=()=>{const mesh=d.createElement('script');mesh.src='/multi-source-mesh.js?v=1.3.3';d.body.appendChild(mesh);const intel=d.createElement('script');intel.src='/live-intel.js?v=1.3.3';d.body.appendChild(intel);const share=d.createElement('script');share.src='/share-ui.js?v=1.3.3';d.body.appendChild(share)};}catch(e){console.error('GhostLane v1.3.3 injection failed',e)}});</script></body></html>
